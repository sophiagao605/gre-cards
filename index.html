<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A+1400 GRE 单词闪卡</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#16202a;--muted:#687483;--line:#e7eaf0;--brand:#147f94;--brand2:#0e5e73;--soft:#eaf7fa;--danger:#d94848}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:760px;margin:0 auto;padding:18px 14px 24px}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}h1{font-size:20px;margin:0 0 6px;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px;line-height:1.5}
.controls{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 8px 22px rgba(31,45,61,.06);margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink)}select{flex:1;min-width:130px}input{flex:2;min-width:160px}button{border:0;border-radius:14px;padding:10px 13px;font-size:14px;font-weight:650;background:#eef2f7;color:var(--ink);cursor:pointer}button.primary{background:var(--brand);color:#fff}button.ghost{background:#fff;border:1px solid var(--line)}button.danger{color:#fff;background:var(--danger)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;min-height:430px;padding:24px 20px;box-shadow:0 18px 50px rgba(31,45,61,.10);display:flex;flex-direction:column;justify-content:space-between}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:18px}.word{text-align:center;color:var(--brand2);font-size:42px;font-weight:700;line-height:1.15;margin:18px 0 8px;word-break:break-word;user-select:none;cursor:pointer}.word:active{transform:scale(.985)}.phonetic{text-align:center;color:var(--muted);font-size:18px;line-height:1.35;margin:0 0 12px;font-family:"Times New Roman",Georgia,serif}.hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}.rootBox{display:none;background:#fffdf7;border:1px solid #f1dfb8;border-radius:20px;padding:14px 16px;margin:0 4px 12px;line-height:1.65}.rootBox.show{display:block}.rootLabel{color:#9a6a00;font-weight:750;margin-right:6px}.exampleBox{display:none;background:#f8fbff;border:1px solid #d9e8ff;border-radius:20px;padding:14px 16px;margin:8px 4px 0;line-height:1.65}.exampleBox.show{display:block}.exampleLabel{color:#2264a7;font-weight:750;margin-right:6px}.answerZone{border-radius:22px;padding:4px;cursor:pointer}.answer{display:block;background:linear-gradient(180deg,#f7fcfd,#fff);border:1px solid #dceff4;border-radius:20px;padding:16px;margin:0;line-height:1.65}.answer.show{display:block}.blankTip{display:none;height:0;border:1px dashed transparent;border-radius:20px}.item{margin:7px 0}.label{color:var(--brand2);font-weight:750;margin-right:6px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.progress{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:10px 0 0}.bar{height:100%;background:var(--brand);width:0%;transition:.25s}.small{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}.badge{display:inline-block;border-radius:999px;background:var(--soft);color:var(--brand2);padding:5px 9px;font-size:12px;font-weight:700}.list{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:none}.list.show{display:block}.wordrow{padding:9px 4px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;font-size:14px}.wordrow:last-child{border-bottom:0}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}
@media(max-width:480px){.word{font-size:36px}.phonetic{font-size:17px}.card{min-height:420px;padding:20px 16px;border-radius:24px}button{padding:10px 9px}.blankTip{height:0}}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div><h1>A+1400 GRE 单词闪卡</h1><div class="sub">闪卡模式｜词根/词缀、释义、短例句和中文释义直接显示｜切换后自动播放读音｜支持搜索、随机、标记不会词。</div></div><span class="badge" id="countBadge"></span></div>
  <div class="controls">
    <div class="row"><select id="sectionFilter"><option value="all">全部 Section</option></select><select id="modeFilter"><option value="all">全部词</option><option value="hard">只看不会词</option></select><input id="searchBox" placeholder="搜索单词 / 词根 / 中文释义 / 短例句" /></div>
    <div class="row" style="margin-top:10px"><button class="ghost" id="shuffleBtn">随机顺序</button><button class="ghost" id="orderBtn">恢复顺序</button><button class="ghost" id="listBtn">词表总览</button><button class="danger" id="clearBtn">清空不会</button></div>
    <div class="progress"><div class="bar" id="progressBar"></div></div><div class="small" id="statusText">正在读取 wordlist.csv...</div>
  </div>
  <div class="card"><div><div class="meta"><span id="metaLeft"></span><span id="metaRight"></span></div><div class="word" id="word" title="点击播放读音"></div><div class="phonetic" id="phonetic"></div><div class="hint">闪卡模式：单词、音标、词根/词缀、释义、短例句和中文释义直接显示；切换后自动播放读音。</div><div class="rootBox" id="rootBox"></div><div class="answerZone" id="answerZone" title="释义已自动显示"><div class="blankTip" id="blankTip"></div><div class="answer" id="answer"></div></div><div class="exampleBox" id="exampleBox"></div></div><div><div class="nav"><button id="prevBtn">上一个</button><button id="nextBtn" class="primary">下一个</button></div><div class="nav2"><button id="hardBtn" class="ghost">标记不会</button><button id="knownBtn" class="ghost">标记已会</button></div></div></div>
  <div class="list" id="listPanel"></div><div class="footer">个人学习试用版｜不公开传播课程整理内容</div>
</div>
<script>
let DATA=[];
function parseCSV(text){
  text=text.replace(/^\uFEFF/, '');
  const rows=[]; let row=[], cell='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch==='"'){
      if(inQuotes && next==='"'){ cell+='"'; i++; } else { inQuotes=!inQuotes; }
    }else if(ch===',' && !inQuotes){
      row.push(cell); cell='';
    }else if((ch==='\n' || ch==='\r') && !inQuotes){
      if(ch==='\r' && next==='\n') i++;
      row.push(cell);
      if(row.some(v=>v.trim()!=='')) rows.push(row);
      row=[]; cell='';
    }else{ cell+=ch; }
  }
  row.push(cell); if(row.some(v=>v.trim()!=='')) rows.push(row);
  return rows;
}
async function loadWordlist(){
  const res=await fetch('wordlist.csv?v=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('wordlist.csv not found: '+res.status);
  const rows=parseCSV(await res.text());
  if(!rows.length) throw new Error('wordlist.csv is empty');
  const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,'').trim());
  DATA=rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()]))).filter(c=>c.word);
  if(!DATA.length) throw new Error('wordlist.csv parsed, but no word rows found');
}
const KEY='agre1400_flashcards_hard_v1';
function normalizeHardId(x){return String(x||'').split('::').pop().trim().toLowerCase()}
let hard=new Set((JSON.parse(localStorage.getItem(KEY)||'[]')).map(normalizeHardId).filter(Boolean));
let current=0,view=[],shuffled=false,speakTimer=null;const $=id=>document.getElementById(id);
function cardId(c){return normalizeHardId(c.word)}function saveHard(){localStorage.setItem(KEY,JSON.stringify([...hard]))}
function initSections(){[...new Set(DATA.map(c=>c.section))].forEach(s=>{const opt=document.createElement('option');opt.value=s;opt.textContent=s;$('sectionFilter').appendChild(opt)})}
function sectionRank(s){const m=String(s||'').match(/Section\s*(\d+)/i);return m?Number(m[1]):9999}
function applyFilters(reset=true,speak=false){const sec=$('sectionFilter').value,mode=$('modeFilter').value,q=$('searchBox').value.trim().toLowerCase();view=DATA.filter(c=>(sec==='all'||c.section===sec)&&(mode==='all'||hard.has(cardId(c)))&&(!q||JSON.stringify(c).toLowerCase().includes(q)));if(shuffled)shuffleArray(view);else view.sort((a,b)=>sectionRank(a.section)-sectionRank(b.section)||Number(a.no)-Number(b.no)||String(a.word).localeCompare(String(b.word)));if(reset)current=0;if(current>=view.length)current=Math.max(0,view.length-1);render();renderList();if(speak)speakCurrent(430)}
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function field(label,val){return val?`<div class="item"><span class="label">${label}</span>${esc(val)}</div>`:''}
function render(){ $('countBadge').textContent=`${view.length} 词｜不会 ${hard.size}`; if(!view.length){$('metaLeft').textContent='没有匹配词';$('metaRight').textContent='';$('word').textContent='—';$('phonetic').textContent='';$('rootBox').innerHTML='';$('rootBox').classList.remove('show');$('exampleBox').innerHTML='';$('exampleBox').classList.remove('show');$('answer').innerHTML='';$('progressBar').style.width='0%';return} const c=view[current];$('metaLeft').textContent=`${c.section} · No.${c.no}`;$('metaRight').textContent=`${current+1} / ${view.length}`;$('word').textContent=c.word;$('phonetic').textContent=c.phonetic||'';if(c.root){$('rootBox').innerHTML=`<span class="rootLabel">词根/词缀</span>${esc(c.root)}`;$('rootBox').classList.add('show')}else{$('rootBox').innerHTML='';$('rootBox').classList.remove('show')}$('answer').innerHTML=field('释义',c.meaning);if(c.example){$('exampleBox').innerHTML=`<span class="exampleLabel">短例句</span>${esc(c.example)}`;$('exampleBox').classList.add('show')}else{$('exampleBox').innerHTML='';$('exampleBox').classList.remove('show')}showAnswer();$('hardBtn').className=hard.has(cardId(c))?'danger':'ghost';$('progressBar').style.width=`${((current+1)/view.length)*100}%`; }
function showAnswer(){$('answer').classList.add('show');$('blankTip').style.display='none'}function hideAnswer(){$('answer').classList.remove('show');$('blankTip').style.display='block'}function toggleAnswer(){$('answer').classList.contains('show')?hideAnswer():showAnswer()}
function renderList(){const html=view.map(c=>`<div class="wordrow"><b>${esc(c.section)}-${esc(c.no)} ${esc(c.word)} <small>${esc(c.phonetic||'')}</small></b><span>${esc(c.root?c.root+'｜'+c.meaning+(c.example?'｜'+c.example:''):c.meaning+(c.example?'｜'+c.example:''))}</span></div>`).join('');$('listPanel').innerHTML=html||'<div class="small">没有匹配词。</div>'}
function chooseVoice(){if(!('speechSynthesis'in window))return null;const voices=window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[];return voices.find(v=>/en-US/i.test(v.lang)&&/google|microsoft|samantha|alex|premium|natural/i.test(v.name))||voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null}
function speakWord(text,delay=300){if(!('speechSynthesis'in window)||!text)return;if(speakTimer)clearTimeout(speakTimer);window.speechSynthesis.cancel();speakTimer=setTimeout(()=>{window.speechSynthesis.cancel();window.speechSynthesis.resume&&window.speechSynthesis.resume();const u=new SpeechSynthesisUtterance(' '+text+'.');u.lang='en-US';u.rate=.82;u.pitch=1;u.volume=1;const voice=chooseVoice();if(voice)u.voice=voice;window.speechSynthesis.speak(u)},delay)}
function speakCurrent(delay=360){if(view.length)speakWord(view[current].word,delay)}function nextCard(){if(view.length){current=(current+1)%view.length;render();speakCurrent(430)}}function prevCard(){if(view.length){current=(current-1+view.length)%view.length;render();speakCurrent(430)}}
function bindEvents(){ $('word').onclick=e=>{e.stopPropagation();speakCurrent(120)};$('answerZone').onclick=()=>showAnswer();$('nextBtn').onclick=()=>nextCard();$('prevBtn').onclick=()=>prevCard();$('hardBtn').onclick=()=>{if(!view.length)return;hard.add(cardId(view[current]));saveHard();render()};$('knownBtn').onclick=()=>{if(!view.length)return;hard.delete(cardId(view[current]));saveHard();if($('modeFilter').value==='hard')applyFilters(false);else render()};$('shuffleBtn').onclick=()=>{shuffled=true;applyFilters(true,true)};$('orderBtn').onclick=()=>{shuffled=false;applyFilters(true,true)};$('listBtn').onclick=()=>{$('listPanel').classList.toggle('show');renderList()};$('clearBtn').onclick=()=>{if(confirm('确定清空所有“不会词”标记吗？')){hard.clear();saveHard();applyFilters(true)}};['sectionFilter','modeFilter'].forEach(id=>$(id).onchange=()=>applyFilters(true,true));$('searchBox').oninput=()=>applyFilters(true,false)}
(async function(){try{await loadWordlist();initSections();bindEvents();$('statusText').textContent=`已读取 wordlist.csv，共 ${DATA.length} 个词。切换单词会自动播放读音；首次播放可能需要点击页面授权。`;applyFilters(true,false); setTimeout(()=>speakCurrent(700),900)}catch(e){$('statusText').textContent='读取 wordlist.csv 失败：'+e.message;console.error(e);}})();
if('speechSynthesis'in window&&window.speechSynthesis.onvoiceschanged!==undefined){window.speechSynthesis.onvoiceschanged=()=>chooseVoice()}window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel()});
</script>
</body>
</html>
