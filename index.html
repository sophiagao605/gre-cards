<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>GRE 单词闪卡库</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--ink:#16202a;--muted:#687483;--line:#e7eaf0;
  --brand:#147f94;--brand2:#0e5e73;--soft:#eaf7fa;--danger:#d94848;
  --gold:#9a6a00;--goldLine:#f1dfb8;--blue:#2264a7;--blueLine:#d9e8ff;
  --green:#167444;--greenBg:#eaf8f0;--greenLine:#b7e2c8;
  --red:#b42318;--redBg:#fff1ef;--redLine:#ffc9c2;
  --neutral:#2459a6;--neutralBg:#f0f6ff;--neutralLine:#c8dcff;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:760px;margin:0 auto;padding:18px 14px 24px}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:20px;margin:0 0 6px;letter-spacing:.2px}.sub{color:var(--muted);font-size:13px;line-height:1.5}
.badge{display:inline-block;border-radius:999px;background:var(--soft);color:var(--brand2);padding:5px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.homeGrid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:18px}
.deckCard{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 20px;box-shadow:0 18px 50px rgba(31,45,61,.08);cursor:pointer;transition:.16s transform,.16s box-shadow,.16s border-color;position:relative;overflow:hidden}
.deckCard:hover{transform:translateY(-2px);box-shadow:0 20px 54px rgba(31,45,61,.12);border-color:#cdd6e5}.deckCard:active{transform:translateY(0) scale(.995)}
.deckTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.deckTitle{font-size:24px;color:var(--brand2);font-weight:800;margin:0 0 8px}.deckDesc{color:var(--muted);font-size:14px;line-height:1.55;margin:0}.deckCount{font-size:13px;font-weight:750;color:var(--brand2);background:var(--soft);border-radius:999px;padding:6px 10px;white-space:nowrap}.deckEnter{margin-top:18px;color:var(--brand2);font-weight:750;font-size:14px}.deckHint{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.55}
.controls{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 8px 22px rgba(31,45,61,.06);margin-bottom:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink)}select{flex:1;min-width:130px}input{flex:2;min-width:160px}
button{border:0;border-radius:14px;padding:10px 13px;font-size:14px;font-weight:650;background:#eef2f7;color:var(--ink);cursor:pointer}button.primary{background:var(--brand);color:#fff}button.ghost{background:#fff;border:1px solid var(--line)}button.danger{color:#fff;background:var(--danger)}button.back{background:#fff;border:1px solid var(--line);color:var(--brand2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;min-height:430px;padding:24px 20px;box-shadow:0 18px 50px rgba(31,45,61,.10);display:flex;flex-direction:column;justify-content:space-between}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:18px;gap:10px}.word{text-align:center;color:var(--brand2);font-size:42px;font-weight:700;line-height:1.15;margin:18px 0 8px;word-break:break-word;user-select:none;cursor:pointer}.word:active{transform:scale(.985)}.phonetic{text-align:center;color:var(--muted);font-size:18px;line-height:1.35;margin:0 0 12px;font-family:"Times New Roman",Georgia,serif}.hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:14px}
.familyBox{display:none;background:#fffdf7;border:1px solid var(--goldLine);border-radius:20px;padding:14px 16px;margin:0 4px 12px;line-height:1.65}.familyBox.show{display:block}.familyLabel{color:var(--gold);font-weight:750;margin-right:6px}
.answerZone{border-radius:22px;padding:4px}.answer{display:block;background:linear-gradient(180deg,#f7fcfd,#fff);border:1px solid #dceff4;border-radius:20px;padding:16px;margin:0;line-height:1.65}.item{margin:7px 0}.label{color:var(--brand2);font-weight:750;margin-right:6px}
.exampleBox{display:none;background:#f8fbff;border:1px solid var(--blueLine);border-radius:20px;padding:14px 16px;margin:12px 4px 0;line-height:1.65}.exampleBox.show{display:block}.exampleLabel{color:var(--blue);font-weight:750;margin-right:6px}.toneArrow{color:#7b8794;margin:0 8px}.toneTag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent}.tone-positive{color:var(--green);background:var(--greenBg);border-color:var(--greenLine)}.tone-negative{color:var(--red);background:var(--redBg);border-color:var(--redLine)}.tone-neutral{color:var(--neutral);background:var(--neutralBg);border-color:var(--neutralLine)}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.progress{height:9px;background:#edf0f5;border-radius:999px;overflow:hidden;margin:10px 0 0}.bar{height:100%;background:var(--brand);width:0%;transition:.25s}.small{color:var(--muted);font-size:12px;line-height:1.5;margin-top:10px}.list{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:none}.list.show{display:block}.wordrow{padding:9px 4px;border-bottom:1px dashed var(--line);display:flex;justify-content:space-between;gap:10px;font-size:14px}.wordrow:last-child{border-bottom:0}.wordrow span{color:var(--muted);text-align:right}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}.hidden{display:none!important}
@media(max-width:480px){.word{font-size:36px}.phonetic{font-size:17px}.card{min-height:420px;padding:20px 16px;border-radius:24px}button{padding:10px 9px}.deckTitle{font-size:22px}.wordrow{display:block}.wordrow span{display:block;text-align:left;margin-top:4px}.meta{font-size:12px}}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div><h1 id="pageTitle">GRE 单词闪卡库</h1><div class="sub" id="pageSub">选择词库进入：词书、阅读词汇、填空词汇。进入后仍保持原闪卡样式。</div></div><span class="badge" id="countBadge"></span></div>

  <section id="homeView">
    <div class="homeGrid" id="deckGrid"></div>
    <div class="deckHint">不会词记录保存在当前浏览器本地；同一设备、同一浏览器、同一网址会保留，换设备不会自动同步。</div>
  </section>

  <section id="learnView" class="hidden">
    <div class="controls">
      <div class="row"><button class="back" id="homeBtn">← 返回入口</button><select id="sectionFilter"><option value="all">全部 Section</option></select><select id="modeFilter"><option value="all">全部词</option><option value="hard">只看不会词</option></select><input id="searchBox" placeholder="搜索单词 / 词族演变 / 中文释义 / 短例句" /></div>
      <div class="row" style="margin-top:10px"><button class="ghost" id="shuffleBtn">随机顺序</button><button class="ghost" id="orderBtn">恢复顺序</button><button class="ghost" id="listBtn">词表总览</button><button class="danger" id="clearBtn">清空不会</button></div>
      <div class="progress"><div class="bar" id="progressBar"></div></div><div class="small" id="statusText">正在读取 wordlist.csv...</div>
    </div>
    <div class="card"><div><div class="meta"><span id="metaLeft"></span><span id="metaRight"></span></div><div class="word" id="word" title="点击播放读音"></div><div class="phonetic" id="phonetic"></div><div class="hint">闪卡模式：单词、音标、词族演变、释义、短例句和方向标签直接显示；切换后自动播放读音。</div><div class="familyBox" id="familyBox"></div><div class="answerZone" id="answerZone" title="释义已自动显示"><div class="answer" id="answer"></div></div><div class="exampleBox" id="exampleBox"></div></div><div><div class="nav"><button id="prevBtn">上一个</button><button id="nextBtn" class="primary">下一个</button></div><div class="nav2"><button id="hardBtn" class="ghost">标记不会</button><button id="knownBtn" class="ghost">标记已会</button></div></div></div>
    <div class="list" id="listPanel"></div>
  </section>

  <div class="footer">个人学习试用版｜不公开传播课程整理内容</div>
</div>
<script>
let DATA=[];
let activeDeck=null,current=0,view=[],shuffled=false,speakTimer=null;
const $=id=>document.getElementById(id);
const KEY='gre_multi_vocab_cards_hard_v1';
const OLD_KEY='agre1400_flashcards_hard_v1';
function parseCSV(text){
  text=text.replace(/^\uFEFF/, '');
  const rows=[]; let row=[], cell='', inQuotes=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i], next=text[i+1];
    if(ch==='"'){
      if(inQuotes && next==='"'){ cell+='"'; i++; } else { inQuotes=!inQuotes; }
    }else if(ch===',' && !inQuotes){
      row.push(cell); cell='';
    }else if((ch==='\n' || ch==='\r') && !inQuotes){
      if(ch==='\r' && next==='\n') i++;
      row.push(cell);
      if(row.some(v=>v.trim()!=='')) rows.push(row);
      row=[]; cell='';
    }else{ cell+=ch; }
  }
  row.push(cell); if(row.some(v=>v.trim()!=='')) rows.push(row);
  return rows;
}
async function loadWordlist(){
  const res=await fetch('wordlist.csv?v=' + Date.now(), {cache:'no-store'});
  if(!res.ok) throw new Error('wordlist.csv not found: '+res.status);
  const rows=parseCSV(await res.text());
  if(!rows.length) throw new Error('wordlist.csv is empty');
  const headers=rows.shift().map(h=>h.replace(/^\uFEFF/,'').trim());
  DATA=rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()]))).filter(c=>c.word);
  if(!DATA.length) throw new Error('wordlist.csv parsed, but no word rows found');
}
function normalizeWord(x){return String(x||'').trim().toLowerCase()}
function hardId(c){return `${c.deck}::${normalizeWord(c.word)}`}
function loadHard(){
  let saved=[];try{saved=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){saved=[]}
  const set=new Set(saved.map(String));
  try{(JSON.parse(localStorage.getItem(OLD_KEY)||'[]')||[]).forEach(w=>{if(w)set.add('book::'+normalizeWord(String(w).split('::').pop()))})}catch(e){}
  return set;
}
let hard=loadHard();
function saveHard(){localStorage.setItem(KEY,JSON.stringify([...hard]))}
function deckMeta(){
  const map=new Map();
  DATA.forEach(c=>{if(!map.has(c.deck)){map.set(c.deck,{deck:c.deck,label:c.deck_label||c.deck,title:c.deck_title||c.deck_label||c.deck,order:Number(c.deck_order)||999,count:0,sections:new Set()})}const m=map.get(c.deck);m.count++;m.sections.add(c.section||'')});
  return [...map.values()].sort((a,b)=>a.order-b.order);
}
function renderHome(){
  const metas=deckMeta();
  $('countBadge').textContent=`${DATA.length} 词`;
  $('deckGrid').innerHTML=metas.map(m=>`<div class="deckCard" data-deck="${esc(m.deck)}"><div class="deckTop"><div><div class="deckTitle">${esc(m.title)}</div><p class="deckDesc">${deckDesc(m.deck)}</p></div><div class="deckCount">${m.count} 词</div></div><div class="deckEnter">进入学习 →</div></div>`).join('');
  [...document.querySelectorAll('.deckCard')].forEach(el=>el.onclick=()=>enterDeck(el.dataset.deck,true));
}
function deckDesc(deck){
  if(deck==='book')return '完整词书库，按每 140 个词划分 Section，适合系统背诵。';
  if(deck==='reading')return '阅读词汇库，偏长难句、论证逻辑和学术语境，适合阅读专项复习。';
  if(deck==='cloze')return '填空词汇库，偏同反义、情感方向和选项辨析，适合填空专项复习。';
  return '自定义词库。';
}
function showHome(){
  activeDeck=null; location.hash='';
  $('homeView').classList.remove('hidden');$('learnView').classList.add('hidden');
  $('pageTitle').textContent='GRE 单词闪卡库';$('pageSub').textContent='选择词库进入：词书、阅读词汇、填空词汇。进入后仍保持原闪卡样式。';
  $('countBadge').textContent=`${DATA.length} 词`;
}
function enterDeck(deck,speak=true){
  activeDeck=deck; const meta=deckMeta().find(m=>m.deck===deck);
  if(!meta)return;
  location.hash=deck;
  $('homeView').classList.add('hidden');$('learnView').classList.remove('hidden');
  $('pageTitle').textContent=meta.title;$('pageSub').textContent='闪卡模式｜词族演变、释义、短例句和方向标签直接显示｜切换后自动播放读音。';
  initSections(); current=0; shuffled=false; $('modeFilter').value='all'; $('searchBox').value=''; $('listPanel').classList.remove('show'); applyFilters(true,speak);
}
function initSections(){
  const sel=$('sectionFilter'); sel.innerHTML='<option value="all">全部 Section</option>';
  const sections=[...new Set(DATA.filter(c=>c.deck===activeDeck).map(c=>c.section||'未分组'))];
  sections.sort((a,b)=>sectionRank(a)-sectionRank(b)||String(a).localeCompare(String(b)));
  sections.forEach(s=>{const opt=document.createElement('option');opt.value=s;opt.textContent=s;sel.appendChild(opt)})
}
function sectionRank(s){const m=String(s||'').match(/Section\s*(\d+)/i);return m?Number(m[1]):9999}
function applyFilters(reset=true,speak=false){
  const sec=$('sectionFilter').value,mode=$('modeFilter').value,q=$('searchBox').value.trim().toLowerCase();
  view=DATA.filter(c=>c.deck===activeDeck&&(sec==='all'||(c.section||'未分组')===sec)&&(mode==='all'||hard.has(hardId(c)))&&(!q||JSON.stringify(c).toLowerCase().includes(q)));
  if(shuffled)shuffleArray(view);else view.sort((a,b)=>sectionRank(a.section)-sectionRank(b.section)||Number(a.no)-Number(b.no)||String(a.word).localeCompare(String(b.word)));
  if(reset)current=0;if(current>=view.length)current=Math.max(0,view.length-1);
  render();renderList();if(speak)speakCurrent(430);
}
function shuffleArray(arr){for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}}
function esc(s){return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function field(label,val){return val?`<div class="item"><span class="label">${label}</span>${esc(val)}</div>`:''}
function toneClass(t){t=t||'';if(t.startsWith('褒义'))return 'tone-positive';if(t.startsWith('贬义'))return 'tone-negative';return 'tone-neutral'}
function deckHardCount(){return DATA.filter(c=>c.deck===activeDeck&&hard.has(hardId(c))).length}
function render(){
  $('countBadge').textContent=`${view.length} 词｜不会 ${deckHardCount()}`;
  if(!view.length){$('metaLeft').textContent='没有匹配词';$('metaRight').textContent='';$('word').textContent='—';$('phonetic').textContent='';$('familyBox').innerHTML='';$('familyBox').classList.remove('show');$('exampleBox').innerHTML='';$('exampleBox').classList.remove('show');$('answer').innerHTML='';$('progressBar').style.width='0%';return}
  const c=view[current];$('metaLeft').textContent=`${c.deck_label||''} · ${c.section||''} · No.${c.no}`;$('metaRight').textContent=`${current+1} / ${view.length}`;$('word').textContent=c.word;$('phonetic').textContent=c.phonetic||'';
  if(c.word_family){$('familyBox').innerHTML=`<span class="familyLabel">词族演变</span>${esc(c.word_family)}`;$('familyBox').classList.add('show')}else{$('familyBox').innerHTML='';$('familyBox').classList.remove('show')}
  $('answer').innerHTML=field('释义',c.meaning);
  if(c.example||c.tone){const toneHtml=c.tone?`<span class="toneArrow">→</span><span class="toneTag ${toneClass(c.tone)}">${esc(c.tone)}</span>`:'';$('exampleBox').innerHTML=`<span class="exampleLabel">短例句</span>${esc(c.example||'')}${toneHtml}`;$('exampleBox').classList.add('show')}else{$('exampleBox').innerHTML='';$('exampleBox').classList.remove('show')}
  $('hardBtn').className=hard.has(hardId(c))?'danger':'ghost';$('progressBar').style.width=`${((current+1)/view.length)*100}%`;
}
function renderList(){const html=view.map(c=>`<div class="wordrow"><b>${esc(c.section)}-${esc(c.no)} ${esc(c.word)} <small>${esc(c.phonetic||'')}</small></b><span>${esc((c.word_family?c.word_family+'｜':'')+c.meaning+(c.example?'｜'+c.example:'')+(c.tone?' → '+c.tone:''))}</span></div>`).join('');$('listPanel').innerHTML=html||'<div class="small">没有匹配词。</div>'}
function chooseVoice(){if(!('speechSynthesis'in window))return null;const voices=window.speechSynthesis.getVoices?window.speechSynthesis.getVoices():[];return voices.find(v=>/en-US/i.test(v.lang)&&/google|microsoft|samantha|alex|premium|natural/i.test(v.name))||voices.find(v=>/en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null}
function speakWord(text,delay=300){if(!('speechSynthesis'in window)||!text)return;if(speakTimer)clearTimeout(speakTimer);window.speechSynthesis.cancel();speakTimer=setTimeout(()=>{window.speechSynthesis.cancel();window.speechSynthesis.resume&&window.speechSynthesis.resume();const u=new SpeechSynthesisUtterance(' '+text+'.');u.lang='en-US';u.rate=.82;u.pitch=1;u.volume=1;const voice=chooseVoice();if(voice)u.voice=voice;window.speechSynthesis.speak(u)},delay)}
function speakCurrent(delay=360){if(view.length)speakWord(view[current].word,delay)}function nextCard(){if(view.length){current=(current+1)%view.length;render();speakCurrent(430)}}function prevCard(){if(view.length){current=(current-1+view.length)%view.length;render();speakCurrent(430)}}
function bindEvents(){
  $('homeBtn').onclick=()=>showHome();$('word').onclick=e=>{e.stopPropagation();speakCurrent(120)};$('nextBtn').onclick=()=>nextCard();$('prevBtn').onclick=()=>prevCard();
  $('hardBtn').onclick=()=>{if(!view.length)return;hard.add(hardId(view[current]));saveHard();render()};$('knownBtn').onclick=()=>{if(!view.length)return;hard.delete(hardId(view[current]));saveHard();if($('modeFilter').value==='hard')applyFilters(false);else render()};
  $('shuffleBtn').onclick=()=>{shuffled=true;applyFilters(true,true)};$('orderBtn').onclick=()=>{shuffled=false;applyFilters(true,true)};$('listBtn').onclick=()=>{$('listPanel').classList.toggle('show');renderList()};$('clearBtn').onclick=()=>{if(confirm('确定清空当前词库的“不会词”标记吗？')){DATA.filter(c=>c.deck===activeDeck).forEach(c=>hard.delete(hardId(c)));saveHard();applyFilters(true)}};
  ['sectionFilter','modeFilter'].forEach(id=>$(id).onchange=()=>applyFilters(true,true));$('searchBox').oninput=()=>applyFilters(true,false);
}
(async function(){try{await loadWordlist();renderHome();bindEvents();const h=location.hash.replace('#','');if(h&&deckMeta().some(m=>m.deck===h))enterDeck(h,false)}catch(e){$('pageSub').textContent='读取 wordlist.csv 失败：'+e.message;console.error(e);}})();
if('speechSynthesis'in window&&window.speechSynthesis.onvoiceschanged!==undefined){window.speechSynthesis.onvoiceschanged=()=>chooseVoice()}window.addEventListener('beforeunload',()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel()});
</script>
</body>
</html>
